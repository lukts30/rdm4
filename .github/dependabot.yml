version: 2
updates:
  - package-ecosystem: "cargo"
    directory: "/"
    schedule:
      interval: "cron"
      # The 15th of every month at 08:00 Berlin time.
      cronjob: "0 8 15 * *"
      timezone: "Europe/Berlin"
    ignore:
      # Updating binrw requires manual API compatibility verification.
      - dependency-name: "binrw"
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "cron"
      cronjob: "0 8 15 * *"
      timezone: "Europe/Berlin"
  - package-ecosystem: "nix"
    directory: "/"
    schedule:
      interval: "cron"
      cronjob: "0 8 15 * *"
      timezone: "Europe/Berlin"
