[package]
name = "rdm4-bin"
version = "0.12.0-alpha.1"
publish = false
authors = ["lukts30 <llukas21307@gmail.com>"]
edition = "2021"
license = "MIT"
repository = "https://github.com/lukts30/rdm4"
default-run = "rdm4-bin"

[workspace]
members = [
    "rdm_derive"
]

[dependencies]
rdm4lib = { path = "rdm4lib" }
log = { version = "0.4", features = [] }
env_logger = "0.11"
clap = { version = "4.5", features = ["derive"] }
serde_json = "1.0"
tempfile = "3"

[dev-dependencies]
gltf = "1.4.1"


[profile.release]
opt-level = 3
debug = 1
overflow-checks = true
